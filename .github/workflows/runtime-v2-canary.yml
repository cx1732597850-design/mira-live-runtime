name: MIRA LIVE runtime v2 end-to-end canary
on:
  push:
    paths:
      - 'scripts/runtime_v2_canary.py'
      - '.github/workflows/runtime-v2-canary.yml'
  workflow_dispatch:
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow numpy scikit-learn
      - name: Run 2026 baseline plus LIVE inference canary
        working-directory: .
        run: PYTHONPATH=scripts python scripts/runtime_v2_canary.py
      - name: Upload canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: mira-live-runtime-v2-canary
          path: artifacts/runtime_v2_canary/
